[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "interactive-glm"
version = "2.0.0"
description = "Interactive viewer for brain imaging data: one background image with any number of ROI/statistical-map overlays."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "dash>=2.17",
    "plotly>=5.18",
    "nilearn>=0.10.3",
    "nibabel>=5.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "joblib>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["interactive_glm*"]

[tool.pytest.ini_options]
# Makes `pytest` work from the project root without installing the package
# first (`pip install -e .` also works and is recommended for actual
# development - this is just so a fresh clone can run the tests immediately).
pythonpath = ["."]
testpaths = ["tests"]
